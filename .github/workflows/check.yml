name: Verify SettleCraft
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: settlecraft
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: settlecraft
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U settlecraft"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://settlecraft:ci-local-only@127.0.0.1:5432/settlecraft
      TEST_DATABASE_URL: postgresql://settlecraft:ci-local-only@127.0.0.1:5432/settlecraft_test
      JWT_SECRET: ephemeral-ci-signing-key-not-for-deployment
      APP_ORIGIN: http://127.0.0.1:5173
      DEMO_PASSWORD: SettleCraft-demo-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=ci-local-only createdb -h 127.0.0.1 -U settlecraft settlecraft_test
      - run: npm run db:migrate
      - run: npm run check
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
