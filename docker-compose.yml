services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: settlecraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: settlecraft
    ports: ['127.0.0.1:55432:5432']
    volumes: ['settlecraft_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U settlecraft']
      interval: 5s
      retries: 10
volumes:
  settlecraft_data:
